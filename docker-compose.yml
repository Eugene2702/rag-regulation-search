

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./testset.json:/app/testset.json  
      - ./evaluate.py:/app/evaluate.py     
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Говорим FastAPI, что Qdrant теперь доступен по имени сервиса "qdrant", а не localhost
      - QDRANT_HOST=qdrant 
      - OLLAMA_HOST=host.docker.internal

volumes:
  qdrant_data: